name: ziftlab-codespace

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ziftlab_admin_dev
      INTERNAL_API_URL: http://app:3000
      INTERNAL_CONTENT_API_URL: http://app:3000
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ziftlab-media
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: 'true'
      S3_PREFIX: admin-media
    init: true
    ports:
      - '3000:3000'
      - '4321:4321'
    volumes:
      - ..:/workspaces/zift:cached

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ziftlab_admin_dev
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ziftlab_admin_dev']
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - '5432:5432'
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_ROOT_USER: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    restart: unless-stopped
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set ziftlab http://minio:9000 minioadmin minioadmin; do sleep 2; done;
      mc mb --ignore-existing ziftlab/ziftlab-media;
      "
    restart: 'no'

volumes:
  minio-data:
  postgres-data:
