packages:
  - admin
  - web
  - packages/*

overrides:
  'esbuild@<=0.24.2': 0.25.12
  'esbuild@>=0.27.3 <0.28.1': 0.28.1
  'postcss@<8.5.10': 8.5.16
  'yaml@>=2.0.0 <2.8.3': 2.9.0

# Scripts de build de dependencias aprobados (pnpm los bloquea por defecto)
allowBuilds:
  argon2: true
  esbuild: true
  sharp: true
  unrs-resolver: true
